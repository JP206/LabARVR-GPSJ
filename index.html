<!DOCTYPE html>
<html>
  <head>
    <title>AR.js A-Frame Location-based</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="script.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* 🎯 Botón encima del canvas */
      #toggleButton {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999; /* muy arriba */
        padding: 12px 24px;
        font-size: 18px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        border: 2px solid white;
        border-radius: 10px;
        pointer-events: auto; /* permite clics */
      }

      /* 🔒 Desactiva clics en el canvas del AR */
      a-scene {
        pointer-events: none;
      }
    </style>
  </head>
  <body>


    <a-scene id="markerScene" embedded arjs style="display: block;">
      <a-marker-camera preset='hiro'></a-marker-camera>
      <a-box position="0 0.5 0" material="opacity: 1;"></a-box>
    </a-scene>
  </body>
</html>
