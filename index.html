<script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
<script src="https://cdn.rawgit.com/jeromeetienne/AR.js/dev/aframe/build/aframe-ar.js"></script>
<script src="script.js"></script>
<link rel="stylesheet" href="styles.css">

<body style='margin:0; overflow:hidden;'>
  <a-scene embedded arjs='sourceType: webcam;'>

    <a-marker id="marcador1" type="pattern" url="Markers/fig1.patt">
      <a-entity id="fig1" geometry="primitive: box;" material="color: red" position="0 0.5 0"></a-entity>
      <a-text id="textoFig1" value="Caja azul" color="black" position="0 1.5 0" align="center"></a-text>
    </a-marker>

    <a-marker id="marcador2" type="pattern" url="Markers/fig2.patt">
      <a-entity id="fig2" geometry="primitive: cone;" material="color: red" position="0 0.5 0"></a-entity>
    </a-marker>

    <a-marker id="marcador3" type="pattern" url="Markers/fig3.patt">
      <a-entity id="fig3" geometry="primitive: box;" material="color: yellow" position="0 0.5 0"></a-entity>
    </a-marker>

    <a-marker id="marcador4" type="pattern" url="Markers/fig4.patt">

      <a-entity id="candado1" gltf-model="Modelos/candado1.glb" position="0 0 0.5" rotation="90 0 180">
        <a-animation attribute="position" direction="alternate" dur="2500" repeat="indefinite" to="0 0 0.8"></a-animation>
        <a-animation attribute="rotation" direction="alternate" dur="2500" repeat="indefinite" to="100 0 190"></a-animation>
      </a-entity>

      <a-entity id="candado2" gltf-model="Modelos/candado2.glb" position="-0.5 0 -0.1" rotation="0 -90 90">
        <a-animation attribute="position" direction="alternate" dur="2000" repeat="indefinite" to="-0.5 0 -0.4"></a-animation>
        <a-animation attribute="rotation" direction="alternate" dur="2500" repeat="indefinite" to="0 -80 100"></a-animation>
      </a-entity>

      <a-entity id="candado3" gltf-model="Modelos/candado3.glb" position="0.5 0 -0.1" rotation="90 0 180">
        <a-animation attribute="position" direction="alternate" dur="2300" repeat="indefinite" to="0.5 0 -0.4"></a-animation>
        <a-animation attribute="rotation" direction="alternate" dur="2500" repeat="indefinite" to="100 0 190"></a-animation>
      </a-entity>

    </a-marker>

    <a-camera-static></a-camera-static>

  </a-scene>

  <button id="botonReclamarLlave" onclick="reclamarLlave()">Reclamar llave</button>

 <div id="formularioLlave">
    <h3>Elegí una opción:</h3>
    <button class="opcion" onclick="seleccionar('opcion1')">Opción 1</button>
    <button class="opcion" onclick="seleccionar('opcion2')">Opción 2</button>
    <button class="opcion" onclick="seleccionar('opcion3')">Opción 3</button>
  </div>

  <div id="formularioInicial">
    <h3>Elegí una opción:</h3>
    <button class="opcion" onclick="seleccionarJugador(1)">Opción 1</button>
    <button class="opcion" onclick="seleccionarJugador(2)">Opción 2</button>
    <button class="opcion" onclick="seleccionarJugador(3)">Opción 3</button>
  </div>

  <div id="cartelMisiones">
    <h3>Ubicaciones de las llaves:</h3>
    <ul>
      <li>
        Donde el hambre y la sed perecen
        <img src="Imagenes/fig1.png" style="display: block; margin-top: 5px;">
      </li>
      <li>
        Donde se alberga gran conocimiento en papel
        <img src="Imagenes/fig2.png" style="display: block; margin-top: 5px;">
      </li>
      <li>
        Donde antaño había una institución bancaria
        <img src="Imagenes/fig3.png" style="display: block; margin-top: 5px;">
      </li>
    </ul>
  </div>
  
  <button id="btnCartelMisiones">Misiones</button>
</body>
