<!DOCTYPE html>
<html>
  <head>
    <title>AR.js A-Frame Location-based</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="script.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* 🎯 Botón encima del canvas */
      #toggleButton {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999; /* muy arriba */
        padding: 12px 24px;
        font-size: 18px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        border: 2px solid white;
        border-radius: 10px;
        pointer-events: auto; /* permite clics */
      }

      /* 🔒 Desactiva clics en el canvas del AR */
      a-scene {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <button id="toggleButton" onclick="toggle()">Toggle</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-camera gps-new-camera id="gpsCam"></a-camera>
      <a-entity material='color: blue' geometry='primitive: box' gps-new-entity-place="latitude: -34.8897600; longitude: -56.1554300" scale="10 10 10"></a-entity>
      
      <a-marker preset="hiro" id="hiroMarker" visible="false">
        <a-box color="blue" position="0 0.5 0"></a-box>
      </a-marker>
    </a-scene>

  </body>
</html>
