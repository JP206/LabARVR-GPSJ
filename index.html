<!DOCTYPE html>
<html>
  <head>
    <title>AR.js A-Frame Location-based</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
    <script type="text/javascript" src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="script.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <button onclick="toggle()" style="position: fixed; bottom: 20px; left: 50%;">toggle</button>

    <a-scene id="gpsScene" embedded arjs="sourceType: webcam; trackingMethod: best;" style="display: block;">
      <a-camera gps-new-camera></a-camera>

      <a-box position='0 0.5 0' material='opacity: 1;'></a-box>
    </a-scene>

    <a-scene id="markerScene" embedded arjs="sourceType: webcam; detectionMode: mono; trackingMethod: best;" style="display: none;">
      <a-entity camera></a-entity>

      <a-marker preset="hiro">
        <a-box position='0 0.5 0' material='opacity: 1;'></a-box>
      </a-marker>
    </a-scene>
  </body>
</html>
