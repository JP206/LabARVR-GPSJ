<script src="https://aframe.io/releases/0.8.2/aframe.min.js"></script>
<script src="https://cdn.rawgit.com/jeromeetienne/AR.js/dev/aframe/build/aframe-ar.js"></script>
<script src="script.js"></script>
<link rel="stylesheet" href="styles.css">

<body style='margin:0; overflow:hidden;'>
  <a-scene embedded arjs='sourceType: webcam;'>

    <a-marker type="pattern" url="markers/fig1.patt">
      <a-entity id="fig1" gltf-model="modelos/llave2.glb" material="color: red" position="0 0.5 0"></a-entity>
      <a-text value="Caja Roja" color="black" position="0 1.5 0" allign="center"></a-text>
    </a-marker>

    <a-marker type="pattern" url="markers/fig2.patt" id="fig2">
      <a-entity id="fig1" gltf-model="modelos/candado2.glb" material="color: red" position="0 0.5 0"></a-entity>
    </a-marker>

    <a-marker type="pattern" url="markers/fig3.patt" id="fig3">
      <a-entity id="fig1" gltf-model="modelos/candado3.glb" material="color: red" position="0 0.5 0"></a-entity>
    </a-marker>

    <a-camera-static></a-camera-static>

  </a-scene>

  <button id="botonReclamarLlave">Reclamar llave</button>

 <div id="formulario">
      <h3>Elegí una opción:</h3>
      <button class="opcion" onclick="seleccionar('Opción 1')">Opción 1</button>
      <button class="opcion" onclick="seleccionar('Opción 2')">Opción 2</button>
      <button class="opcion" onclick="seleccionar('Opción 3')">Opción 3</button>
    </div>
</body>
